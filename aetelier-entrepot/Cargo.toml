[package]
name = "aetelier-entrepot"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Object-store transport for aetelier collectors: signed S3 access, listing, retrieval, and archive codecs"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["crypto", "framework", "machine-learning", "math", "trading"]
categories = ["data-structures", "development-tools", "finance", "simulation"]
publish = false

[lib]
name = "aetelier_entrepot"
path = "src/lib.rs"

[dependencies]
async-trait = { version = "0.1" }
chrono = { version = "0.4" }
hex = { version = "0.4" }
hmac = { version = "0.12" }
lz4_flex = { version = "0.11", default-features = false, features = ["frame", "std"] }
md-5 = { version = "0.10" }
quick-xml = { version = "0.37" }
rand = { workspace = true }
reqwest = { workspace = true }
sha2 = { version = "0.10" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { version = "0.1" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
