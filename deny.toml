# cargo-deny configuration — supply-chain gates for the SDK workspace.
# Checked in CI (advisories, licenses, bans, sources) on every PR and push.

[advisories]
version = 2
yanked = "warn"
# Add a RUSTSEC id here (with a comment) to consciously accept one advisory.
ignore = [
    # paste is unmaintained (transitive, proc-macro only, build-time).
    # Removed naturally when its dependents bump; no runtime exposure.
    "RUSTSEC-2024-0436",
]

[bans]
# The rustls line is single (0.23) after the transport modernization. Remaining
# duplicate transitive versions (e.g. webpki-roots 0.26 + 1.0) surface as
# warnings rather than blocking PRs.
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # tiny-keccak: public-domain dedication.
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
