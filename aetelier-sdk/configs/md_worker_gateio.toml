# Gate.io USDT pairs — spot.order_book limited-depth snapshot + raw trades
#
#   cargo run -p aetelier-sdk --bin md_worker --features parquet -- \
#     --config aetelier-sdk/configs/md_worker_gateio.toml

[collect]
exchange = "gateio"
framework_ingest = true
gap_threshold_secs = 600

[collect.datatypes.orderbook]
enabled = true
depth = 20          # snapped up to a Gate-accepted level (1, 5, 10, 20, 50, 100)

[collect.datatypes.trades]
enabled = true

[collect.datatypes.liquidations]
enabled = false

[collect.datatypes.funding_rates]
enabled = false

[collect.datatypes.open_interest]
enabled = false

[collect.sync]
sync_mode = "on_time"
flush_threshold = 3600

[collect.sync.update_frequency]
value = 100
unit = "Millis"

[[collect.output]]
type = "parquet"
dir = "datasets/collected/gateio/"

[[collect.output]]
type = "terminal"

# ── Workers ──────────────────────────────────────────────
# Gate.io currency pairs are underscored (e.g. BTC_USDT).

[[workers]]
symbol = "BTC_USDT"

[[workers]]
symbol = "ETH_USDT"

[[workers]]
symbol = "SOL_USDT"

# ── Session ──────────────────────────────────────────────
# [session]
# duration_hours = N
