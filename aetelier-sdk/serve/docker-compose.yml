name: aetelier-serve

services:
  binance:
    image: aetelier-md-worker:v0.1.0
    container_name: md_worker_binance
    labels:
      aetelier.lifecycle: "legacy"
      aetelier.component: "aetelier-md-worker"
    restart: unless-stopped
    volumes:
      - ./configs/md_worker_binance.toml:/configs/manifest.toml:ro
      - ./datasets:/data
    environment:
      - RUST_LOG=aetelier_connect=info,aetelier_sdk=info,md_worker=info
      - TZ=UTC
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  coinbase:
    image: aetelier-md-worker:v0.1.0
    container_name: md_worker_coinbase
