[package]
name = "aetelier-connect"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Exchange connectivity, workers, and synchronizers for the aetelier-sdk engine"
documentation = "https://docs.rs/aetelier-connect"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["crypto", "framework", "machine-learning", "math", "trading"]
categories = ["data-structures", "development-tools", "finance", "simulation"]
publish = false
autoexamples = false
autotests = false

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html", "--cfg", "docsrs"]
all-features = true

[lib]
name = "aetelier_connect"
path = "src/lib.rs"

[[example]]
name = "capture_fixture"
path = "examples/capture_fixture.rs"

[[example]]
name = "framework_live"
path = "examples/framework_live/framework_live.rs"

[[example]]
name = "data_worker_framework"
path = "examples/data_worker_framework/data_worker_framework.rs"

[[example]]
name = "run_data_worker"
path = "examples/data_worker/run_data_worker.rs"

[[example]]
name = "run_market_worker"
path = "examples/md_worker/run_market_worker.rs"
required-features = ["parquet"]

[[example]]
name = "read_market_worker"
path = "examples/md_worker/read_market_worker.rs"
required-features = ["parquet"]

[[example]]
name = "multi_sync_workers"
path = "examples/multi_sync/multi_sync_workers.rs"
required-features = ["parquet"]

[[test]]
