name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: fmt + clippy + tests (${{ matrix.os }})
    runs-on: [self-hosted, Linux]
    # The parquet/arrow test binaries link with full debuginfo, which balloons
    # target/ and the linker's memory; on the ubuntu runner that surfaced as
    # `ld: signal 7 (Bus error), core dumped` while the tests themselves passed.
    # CI never reads the debuginfo, so drop it (and incremental) to keep the
    # link within the runner's disk/memory budget.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt (blocking)
        run: cargo fmt --all -- --check

      - name: cargo clippy (blocking)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Parquet-gated code (the `validate`/`md_worker` bins, the io flush path,
      # and any `#[cfg(feature = "parquet")]` test in any crate) is invisible to
      # the default-feature legs above. Compile AND run it workspace-wide so a
      # parquet-only breakage (e.g. a test built with the pre-Decimal Trade
      # shape) cannot hide behind a green default run.
      - name: cargo clippy (parquet-gated, workspace, blocking)
        run: cargo clippy --locked --workspace --all-targets --features aetelier-sdk/parquet -- -D warnings

      - name: cargo nextest (unit + integration)
        run: cargo nextest run --locked --workspace

      - name: cargo nextest (parquet-gated suites, workspace)
        run: cargo nextest run --locked --workspace --features aetelier-sdk/parquet

      - name: cargo test (doc tests)
        run: cargo test --locked --workspace --doc

      - name: cargo doc (blocking)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  features:
    name: per-crate feature matrix
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2

      # Workspace builds unify features across members, masking per-crate
      # breakage that only appears when a crate is depended on in isolation.
      # Excluded feature: `torch` needs the libtorch C library, absent on
      # runners (experimental, see aetelier-io docs).
      # No --no-dev-deps: it rewrites Cargo.toml mid-run, which --locked
      # rejects; resolver 2 already keeps dev-dep features out of `check`.
      - name: cargo hack check (each feature per crate)
        run: cargo hack check --locked --workspace --each-feature --exclude-features torch

  msrv:
    name: MSRV (1.88.0)
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on the declared rust-version
        run: cargo check --locked --workspace

  deny:
    name: cargo deny (advisories + licenses + bans + sources)
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: Swatinem/rust-cache@v2
      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources
