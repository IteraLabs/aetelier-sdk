version: 2
updates:
  # Cargo version bumps are made deliberately by a maintainer: Cargo.lock is
  # committed and every CI step runs --locked, so the repo's builds and the
  # released binaries are reproducible. Dependabot *security* updates are
  # governed by the repository's security settings and are unaffected by
  # open-pull-requests-limit, so advisories still surface as PRs; cargo-deny's
  # advisories check is the blocking gate on top of that.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
