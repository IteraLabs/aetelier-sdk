[dependencies]
aetelier-entrepot = { path = "../aetelier-entrepot", version = "0.1.0" }
aetelier-telemetry = { path = "../aetelier-telemetry", version = "0.1.0", optional = true }
aetelier-types = { path = "../aetelier-types", version = "0.1.0" }
anyhow = { version = "1.0" }
async-rate-limiter = { version = "1.0", features = ["rt-tokio"] }
async-trait = { version = "0.1" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crc32fast = { version = "1" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3" }
opentelemetry = { version = "0.31", optional = true }
rand = { version = "0.9.0" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls"
] }
rust_decimal = { version = "1.34", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = { version = "1.0.64" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.0" }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
aetelier-io = { path = "../aetelier-io", features = ["parquet"] }
lz4_flex = { version = "0.11", default-features = false, features = ["frame", "std"] }
aetelier-types = { path = "../aetelier-types", version = "0.1.0" }
futures-util = "0.3"
serde_json = { version = "1.0", features = ["raw_value"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[features]
default = []
parquet = []
telemetry = ["dep:aetelier-telemetry", "dep:opentelemetry"]

[lints]
workspace = true
