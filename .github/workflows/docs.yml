# docs — rustdoc to GitHub Pages.
#
# Publishes `cargo doc --workspace --no-deps` (KaTeX header included) on every
# push to main, with a root redirect to the aetelier_sdk facade crate.
#
# Activation: GitHub Pages serves only public repositories on the Free plan.
# Gated to manual dispatch until release day so pre-release pushes stay free
# of failed deploy runs. On release: make the repository public, enable Pages
# with Source = GitHub Actions (Settings, Pages), restore the push trigger
# (branches: [main]) so docs track main, and dispatch once.
name: docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: build rustdoc
        env:
          RUSTDOCFLAGS: --html-in-header katex-header.html -D warnings
        run: cargo doc --locked --workspace --no-deps --features aetelier-sdk/parquet
      - name: root redirect
        run: printf '<meta http-equiv="refresh" content="0; url=aetelier_sdk/index.html">' > target/doc/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
