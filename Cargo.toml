[workspace]
resolver = "2"
members = [
  "aetelier-connect",
  "aetelier-entrepot",
  "aetelier-io",
  "aetelier-sdk",
  "aetelier-telemetry",
  "aetelier-types",
]

default-members = [
  "aetelier-connect",
  "aetelier-sdk",
]

[workspace.package]
version = "0.1.0"
authors = ["iteralabs.xyz"]
edition = "2024"
rust-version = "1.88.0"
description = "Rust engine for high-frequency market-microstructure data: exchange connectivity, ingestion, synchronization, and columnar I/O."
license = "Apache-2.0"
homepage = "https://aetelier.xyz"
repository = "https://github.com/iteralabs/aetelier-sdk"
readme = "README.md"
keywords = ["crypto", "framework", "machine-learning", "math", "trading"]
categories = ["data-structures", "development-tools", "finance", "simulation"]
exclude = ["*.log", ".github", "Makefile.toml", "assets/*", "tags"]
include = ["katex-header.html"]

[workspace.dependencies]
aetelier-io = { version = "0.1.0" }
aetelier-sdk = { version = "0.1.0" }
aetelier-types = { version = "0.1.0" }

clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
csv = { version = "1.3" }
futures = { version = "0.3" }
human_bytes = { version = "0.4.1" }
memuse = { version = "0.2.0" }
nalgebra = { version = "0.33" }
nalgebra-sparse = { version = "0.10" }
num-traits = { version = "0.2" }
rand = { version = "0.9.0" }
rand_distr = { version = "0.5.0" }
reqwest = { version = "0.12", features = ["json"] }
rust_decimal = { version = "1.34", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = { version = "1.0.64" }
tokio = { version = "1", features = ["full"] }
toml = { version = "0.8" }

[workspace.lints.rust]
dead_code = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(nightly)"] }
unreachable_code = "deny"
unreachable_patterns = "deny"
unsafe_code = "forbid"
unused_extern_crates = "allow"
unused_variables = "warn"

[workspace.lints.clippy]
large_enum_variant = "allow"
too_many_arguments = "allow"
