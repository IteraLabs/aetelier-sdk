# OKX
#
# MarketWorker Example — synchronised snapshots to Parquet
#
# Usage:
#   cargo run -p aetelier-sdk --bin md_worker --features parquet \
#     -- --config aetelier-connect/examples/md_worker/md_worker_okx.toml

[collect]
exchange = "okx"
framework_ingest = true
gap_threshold_secs = 30

[collect.datatypes.orderbook]
enabled = true
depth = 50          # OKX `books5` pushes a full top-5 snapshot; depth is informational

[collect.datatypes.trades]
enabled = true

[collect.datatypes.liquidations]
enabled = false

[collect.datatypes.funding_rates]
enabled = false

[collect.datatypes.open_interest]
enabled = false

[collect.sync]
sync_mode = "on_time"
flush_threshold = 3000  # snapshots per Parquet flush (3000 x 200ms = 10 min)

[collect.sync.update_frequency]
value = 200
unit = "Millis"

# Dual output: Parquet for persistence + Terminal for visibility.
[[collect.output]]
type = "parquet"
dir = "datasets/collected/okx/"

[[collect.output]]
type = "terminal"

# ── Workers ─────────────────────────────────────────────────────────────
# OKX instrument ids are hyphenated (e.g. BTC-USDT).

[[workers]]
symbol = "BTC-USDT"

[[workers]]
symbol = "ETH-USDT"

[[workers]]
symbol = "SOL-USDT"

# ── Session ─────────────────────────────────────────────────────────────

# [session]
# Run for N seconds then shut down gracefully.
# duration_hours = N
