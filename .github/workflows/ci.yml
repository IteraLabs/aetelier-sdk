name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:

  gates:
    name: fmt + clippy + tests (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt (blocking)
        run: cargo fmt --all -- --check

      - name: cargo clippy (blocking)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo clippy (parquet-gated, workspace, blocking)
        run: cargo clippy --locked --workspace --all-targets --features aetelier-sdk/parquet -- -D warnings

      - name: cargo nextest (unit + integration)
        run: cargo nextest run --locked --workspace

      - name: cargo nextest (parquet-gated suites, workspace)
        run: cargo nextest run --locked --workspace --features aetelier-sdk/parquet

      - name: cargo test (doc tests)
        run: cargo test --locked --workspace --doc

      - name: cargo doc (blocking)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  portability:
    name: build + test (${{ matrix.triple }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - runner: macos-15
            triple: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - name: assert host triple
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "host=$host"
          if [ "$host" != "${{ matrix.triple }}" ]; then
            echo "::error::expected ${{ matrix.triple }}, runner reports $host"
            exit 1
          fi

      - name: cargo build (workspace)
        run: cargo build --locked --workspace --all-targets

      - name: cargo nextest (unit + integration)
        run: cargo nextest run --locked --workspace

      - name: cargo nextest (parquet-gated suites, workspace)
        run: cargo nextest run --locked --workspace --features aetelier-sdk/parquet

  features:
    name: per-crate feature matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2

      - name: cargo hack check (each feature per crate)
        run: cargo hack check --locked --workspace --each-feature --exclude-features torch

  msrv:
    name: MSRV (1.88.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on the declared rust-version
        run: cargo check --locked --workspace

  deny:
    name: cargo deny (advisories + licenses + bans + sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: Swatinem/rust-cache@v2
      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources

  ci-green:
    name: ci-green
    if: always()
    needs: [gates, portability, features, msrv, deny]
    runs-on: ubuntu-24.04
    steps:
      - name: assert every upstream job succeeded
        run: |
          echo 'gates=${{ needs.gates.result }}'
          echo 'portability=${{ needs.portability.result }}'
          echo 'features=${{ needs.features.result }}'
          echo 'msrv=${{ needs.msrv.result }}'
          echo 'deny=${{ needs.deny.result }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "::error::at least one ci job did not succeed"
            exit 1
          fi
