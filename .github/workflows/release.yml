# release — full gates + binaries on every version tag.
#
# Runs the complete CI gate against the tagged commit, builds the three
# first-class binaries (md_worker, validate, rehydrate) in release mode for
# linux-x64, and attaches them to the GitHub Release for the
# tag. The Release itself is created by the maintainer (gh release create);
# this workflow uploads artifacts to it.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gates:
    # Self-hosted, not ubuntu-latest: this workflow triggers on `push: tags`
    # ONLY — there is no pull_request path, so a fork can never run code here
    # (pushing a tag requires write access). That keeps self-hosted safe even
    # on a public repo, unlike ci.yml which does take pull_request.
    #
    # Third-party actions are pinned to a commit SHA, not a moving tag: a
    # self-hosted runner is not ephemeral, so an upstream tag repoint would
    # execute on it directly. Bump these by hand; the trailing comment records
    # the tag each SHA resolved from.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@9e3720000324bf314ab081346108fc3bab8d6b74 # nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --features aetelier-sdk/parquet -- -D warnings
      - run: cargo nextest run --locked --workspace --features aetelier-sdk/parquet
      - run: cargo test --locked --workspace --doc

  binaries:
    needs: gates
    strategy:
      matrix:
        include:
          # Linux/X64 is built natively, no cross-compilation. macOS is not
          # built here: released Docker images are Linux and never need one.
          - os: [self-hosted, Linux, X64]
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: build release binaries
        run: cargo build --locked --release -p aetelier-sdk --features parquet --bin md_worker --bin validate --bin rehydrate
      - name: package
        run: |
          set -euo pipefail
          mkdir -p dist
          for b in md_worker validate rehydrate; do
            cp "target/release/$b" "dist/${b}-${{ github.ref_name }}-${{ matrix.triple }}"
          done
      - name: attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber
