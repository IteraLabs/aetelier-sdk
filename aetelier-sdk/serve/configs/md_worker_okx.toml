# OKX USDT pairs — books5 top-5 LOB + raw trades, count-based flush

[collect]
exchange = "okx"
framework_ingest = true
gap_threshold_secs = 30

[collect.datatypes.orderbook]
enabled = true
depth = 5

[collect.datatypes.trades]
enabled = true

[collect.datatypes.liquidations]
enabled = false

[collect.datatypes.funding_rates]
enabled = false

[collect.datatypes.open_interest]
enabled = false

[collect.sync]
sync_mode = "on_time"
flush_threshold = 18000

[collect.sync.update_frequency]
value = 250
unit = "Millis"

[[collect.output]]
type = "parquet"
# Absolute path — must match the docker-compose volume mount
# (`./serve/datasets:/data`).
dir = "/data/okx/"

[[collect.output]]
type = "terminal"

# ── Workers ──────────────────────────────────────────────────
# OKX instrument ids are hyphenated.

[[workers]]
symbol = "BTC-USDT"

[[workers]]
symbol = "ETH-USDT"

[[workers]]
symbol = "SOL-USDT"
