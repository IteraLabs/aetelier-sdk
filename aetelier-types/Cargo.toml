[package]
name = "aetelier-types"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared types, error taxonomy, configs, and serialization for the aetelier-sdk engine"
documentation = "https://docs.rs/aetelier-types"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["crypto", "framework", "machine-learning", "math", "trading"]
categories = ["data-structures", "development-tools", "finance", "simulation"]
publish = false

[lib]
name = "aetelier_types"
path = "src/lib.rs"

[[test]]
name = "test_order_builder"
path = "tests/types/builders/test_order_builder.rs"

[[test]]
name = "test_trade_builder"
path = "tests/types/builders/test_trade_builder.rs"

[[test]]
name = "test_liquidation_builder"
path = "tests/types/builders/test_liquidation_builder.rs"

[[test]]
name = "test_funding_builder"
path = "tests/types/builders/test_funding_builder.rs"

[[test]]
name = "test_open_interest_builder"
path = "tests/types/builders/test_open_interest_builder.rs"

[[test]]
name = "test_error_taxonomy"
path = "tests/types/errors/test_error_taxonomy.rs"

[[test]]
name = "test_order_methods"
path = "tests/types/orders/test_order_methods.rs"

[[test]]
name = "test_orderbook_basic"
path = "tests/types/order_books/test_orderbook_basic.rs"

[[test]]
name = "test_orderbook_methods"
path = "tests/types/order_books/test_orderbook_methods.rs"

[[test]]
name = "test_orderbook_delta_errors"
path = "tests/types/order_books/test_orderbook_delta_errors.rs"

[[test]]
name = "test_trades"
path = "tests/types/trades/test_trades.rs"

[[test]]
name = "test_liquidations"
path = "tests/types/liquidations/test_liquidations.rs"

[[test]]
name = "test_market_snapshot"
path = "tests/types/snapshots/test_market_snapshot.rs"

[[test]]
name = "test_resolutions"
path = "tests/types/temporal/test_resolutions.rs"

[[test]]
name = "test_market_config"
path = "tests/types/config/test_market_config.rs"

[[test]]
name = "test_serde_roundtrip"
path = "tests/types/wire_contract/test_serde_roundtrip.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rand = { version = "0.9.0" }
rust_decimal = { version = "1.34", features = ["serde", "serde-with-float"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = { version = "1.0.64" }
toml = { version = "0.8" }
tracing = { version = "0.1" }
uuid = { version = "1.0", features = ["serde", "v4"] }

getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
tsify-next = { version = "0.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
rand = { version = "0.9.0" }
serde_json = { version = "1.0" }

[features]
default = ["std"]

std = []

wasm = [
  "dep:getrandom",
  "dep:js-sys",
  "dep:serde-wasm-bindgen",
  "dep:tsify-next",
  "dep:wasm-bindgen"
]

[lints]
workspace = true
