# Kraken USDC pairs — top-20 LOB + raw trades, count-based flush

[collect]
exchange = "kraken"
framework_ingest = true
gap_threshold_secs = 30

[collect.datatypes.orderbook]
enabled = true
depth = 25

[collect.datatypes.trades]
enabled = true

[collect.datatypes.liquidations]
enabled = false

[collect.datatypes.funding_rates]
enabled = false

[collect.datatypes.open_interest]
enabled = false

[collect.sync]
sync_mode = "on_time"
flush_threshold = 18000

[collect.sync.update_frequency]
value = 250
unit = "Millis"

[[collect.output]]
type = "parquet"
# Absolute path — must match the docker-compose volume mount
# (`./serve/datasets:/data`). Relative paths would land at
# `/home/collector/...` inside the container, which is NOT bind-mounted
# back to the host, so files would silently disappear when the
# container exits.
dir = "/data/kraken/"

[[collect.output]]
type = "terminal"

# ── Workers ─────────────────────────────────────────────────────────────

[[workers]]
symbol = "BTC/USDC"

[[workers]]
symbol = "SOL/USDC"

[[workers]]
symbol = "SHIB/USDC"

[[workers]]
symbol = "TON/USDC"
